name: Rounds
options:
  bundleIdPrefix: com.padillatomas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  UIWorkouts:
    # Local path during co-development — a UIWorkouts edit is live in the next
    # Rounds build, no tag needed. Flip to a version tag at an app release.
    path: ../UI-Workouts
targets:
  Rounds:
    type: application
    platform: iOS
    sources:
      - path: Rounds
        excludes:
          - project.yml
    dependencies:
      - package: UIWorkouts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.padillatomas.Rounds
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rounds
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Generated-Info.plist
      properties:
        UILaunchScreen: {}
  RoundsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RoundsTests
    dependencies:
      - target: Rounds
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.padillatomas.RoundsTests
schemes:
  Rounds:
    build:
      targets:
        Rounds: all
        RoundsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RoundsTests
    archive:
      config: Release
