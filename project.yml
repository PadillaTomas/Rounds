name: Rounds
options:
  bundleIdPrefix: com.padillatomas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    # Xcode "recommended settings" (new-project template defaults) — adopted so the
    # generated project stays on Apple's current baseline. Sandboxing enforces
    # input/output declarations on any future run-script phase; symbol generation
    # makes String Catalog keys available as typed accessors.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    # Marketing version (App Store) and build number. Bump MARKETING_VERSION per
    # release; bump CURRENT_PROJECT_VERSION for every upload of the same version.
    # 1.1.0 — a free UI-refresh + fixes update; the paid 2.0 line (paywall,
    # history, calendar, health, share) stays on develop, not in this build.
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # DEVELOPMENT_TEAM is intentionally not set. CODE_SIGN_STYLE = Automatic
    # resolves the one team on the account; Xcode stores the pick in the
    # (gitignored) generated project.
packages:
  UIWorkouts:
    # Pinned exactly here (not via a committed Package.resolved — xcodebuild keeps
    # rewriting that file). Bump this string to adopt a new UIWorkouts tag. During
    # UIWorkouts co-development swap to `path: ../UI-Workouts` for live edits.
    url: https://github.com/PadillaTomas/UI-Workouts.git
    exactVersion: "1.0.0"
targets:
  Rounds:
    type: application
    platform: iOS
    sources:
      - path: Rounds
        excludes:
          - project.yml
    dependencies:
      - package: UIWorkouts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.padillatomas.Rounds
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rounds
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # iPhone only for v1 — an iPad build means an iPad layout pass + a
        # separate App Store screenshot set (see RO-7). Revisit post-launch.
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Generated-Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # No non-exempt encryption (HTTPS / standard crypto only) — skips the
        # per-upload Export Compliance prompt in App Store Connect.
        ITSAppUsesNonExemptEncryption: false
        # The workout timer keeps running with the screen locked / app in the
        # background so the round bells still fire — CuePlayer plays a silent
        # keep-alive loop for the duration of the workout.
        UIBackgroundModes: [audio]
  RoundsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RoundsTests
    dependencies:
      - target: Rounds
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.padillatomas.RoundsTests
schemes:
  Rounds:
    build:
      targets:
        Rounds: all
        RoundsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RoundsTests
    archive:
      config: Release
