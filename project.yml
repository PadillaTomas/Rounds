name: Rounds
options:
  bundleIdPrefix: com.padillatomas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
# DEVELOPMENT_TEAM comes from Signing.xcconfig (gitignored, per-machine) so Xcode
# never prompts "Signing requires a development team" and the value can't be lost
# to `xcodegen generate` or `git checkout`. Copy Signing.xcconfig.template to
# Signing.xcconfig and set your Team ID. Missing file = empty team (CI builds
# with a stub identity).
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
packages:
  UIWorkouts:
    # Pinned to a released tag for store builds. During UIWorkouts co-development
    # swap this back to `path: ../UI-Workouts` so edits are live without a tag.
    url: https://github.com/PadillaTomas/UI-Workouts.git
    from: "0.5.0"
targets:
  Rounds:
    type: application
    platform: iOS
    sources:
      - path: Rounds
        excludes:
          - project.yml
    dependencies:
      - package: UIWorkouts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.padillatomas.Rounds
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rounds
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Generated-Info.plist
      properties:
        UILaunchScreen: {}
  RoundsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RoundsTests
    dependencies:
      - target: Rounds
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.padillatomas.RoundsTests
schemes:
  Rounds:
    build:
      targets:
        Rounds: all
        RoundsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RoundsTests
    archive:
      config: Release
